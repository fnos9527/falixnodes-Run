name: FalixNodes Auto Renew

on:
  schedule:
    # 每天固定在国际标准时间 08:00 (北京时间下午 4:00) 运行一次
    - cron: '0 8 * * *'
  workflow_dispatch: # 支持控制台手动点击执行

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install System Dependencies for Puppeteer & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libasound2 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 unzip wget

      - name: Download Xray Core v25.9.11
        run: |
          wget https://github.com/XTLS/Xray-core/releases/download/v25.9.11/Xray-linux-64.zip
          unzip Xray-linux-64.zip -d xray-bin
          chmod +x xray-bin/xray

      - name: Install Node Dependencies
        run: |
          npm init -y
          npm install puppeteer-real-browser

      - name: Run Auto Renew Script
        env:
          VLESS_LINK: ${{ secrets.VLESS_LINK }}
          FALIX_EMAIL: ${{ secrets.FALIX_EMAIL }}
          FALIX_PASSWORD: ${{ secrets.FALIX_PASSWORD }}
        run: |
          # 启动 xvfb 虚拟图形界面服务并开始执行主程序
          xvfb-run --server-args="-screen 0 1280x1024x24" node index.js

      - name: Send Telegram Notification
        if: always() # 无论脚本成功与否，均执行此步发送通知
        run: |
          if [ -n "${{ secrets.TG_BOT_TOKEN }}" ] && [ -n "${{ secrets.TG_CHAT_ID }}" ]; then
            # 读取初始时间状态，如未获取成功则标为未知
            TIMER_STATUS="未知"
            if [ -f timer_status.txt ]; then
              TIMER_STATUS=$(cat timer_status.txt)
            fi
            
            # 判断续期流程是否顺利走完（根据最终截图文件是否存在）
            STATUS_MSG="❌ 续期流程可能异常中断，请登录控制台检查"
            if [ -f screenshot3_result.png ]; then
              STATUS_MSG="✅ 续期流程已执行完毕，具体结果请登录控制台确认"
            fi

            # 采用 printf 格式化换行，避免 YAML 缩进错误
            TEXT_MSG="🤖 *FalixNodes 自动续期任务运行完毕* 🤖\n\n📍 服务器初始剩余时间: *${TIMER_STATUS}*\n\n📊 运行状态: ${STATUS_MSG}"

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
              --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" \
              --data-urlencode "parse_mode=Markdown" \
              --data-urlencode "text=$(printf "$TEXT_MSG")"
          else
            echo "TG_BOT_TOKEN 与 TG_CHAT_ID 未配置或不完整，跳过推送。"
          fi
