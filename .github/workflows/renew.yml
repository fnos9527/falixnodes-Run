name: FalixNodes Auto Renew

on:
  schedule:
    # 每天 UTC 0 点和 12 点运行（北京时间 8:00 和 20:00）
    - cron: '0 18 * * *'
  workflow_dispatch: # 支持手动点击 Run workflow 触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Packages & Node Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb curl
          npm install

      - name: Setup optional VLESS/VMess/Trojan node
        id: proxy_setup
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            echo "检测到 NODE_LINK，正在启动 sing-box 代理..."
            
            # 下载最新 sing-box
            curl -Lo sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.9.0/sing-box-1.9.0-linux-amd64.tar.gz
            tar -xzf sing-box.tar.gz
            mv sing-box-*/sing-box ./sing-box
            chmod +x ./sing-box

            # 使用 node 脚本解析 VLESS 链接并生成标准 sing-box 配置
            node -e '
              const url = new URL(process.env.NODE_LINK);
              const protocol = url.protocol.replace(":", "");
              const uuid = url.username;
              const server = url.hostname;
              const server_port = parseInt(url.port || (url.protocol === "vless:" ? "443" : "80"));
              const params = url.searchParams;

              let outbound = {
                type: protocol,
                tag: "proxy-out",
                server: server,
                server_port: server_port,
                uuid: uuid
              };

              if (params.get("security") === "tls") {
                outbound.tls = {
                  enabled: true,
                  server_name: params.get("sni") || server,
                  insecure: params.get("insecure") === "1" || params.get("allowInsecure") === "1"
                };
                if (params.get("fp")) {
                  outbound.tls.utls = { enabled: true, fingerprint: params.get("fp") };
                }
              }

              const netType = params.get("type");
              if (netType === "ws") {
                outbound.transport = {
                  type: "ws",
                  path: params.get("path") || "/",
                  headers: {
                    Host: params.get("host") || params.get("sni") || server
                  }
                };
              }

              const config = {
                log: { level: "info" },
                inbounds: [{
                  type: "socks",
                  tag: "socks-in",
                  listen: "127.0.0.1",
                  listen_port: 1080
                }],
                outbounds: [
                  outbound,
                  { type: "direct", tag: "direct" }
                ]
              };

              require("fs").writeFileSync("singbox-config.json", JSON.stringify(config, null, 2));
            '

            # 启动 sing-box
            nohup ./sing-box run -c singbox-config.json > sing-box.log 2>&1 &
            echo $! > sing-box.pid
            sleep 3

            # 联通性测试
            TEST_IP=$(curl -s --socks5 127.0.0.1:1080 --max-time 10 https://api.ipify.org || true)
            if [ -n "$TEST_IP" ]; then
              echo "✅ 节点代理启动成功！当前出口 IP: $TEST_IP"
              echo "IS_PROXY=true" >> $GITHUB_ENV
            else
              echo "⚠️ 节点代理未能连通网络，sing-box 日志如下："
              cat sing-box.log || true
              echo "已自动降级为直连模式..."
              echo "IS_PROXY=false" >> $GITHUB_ENV
            fi
          else
            echo "未配置 NODE_LINK，直接使用直连模式。"
            echo "IS_PROXY=false" >> $GITHUB_ENV
          fi

      - name: Run Puppeteer with Xvfb
        env:
          FALIX_EMAIL: ${{ secrets.FALIX_EMAIL }}
          FALIX_PASSWORD: ${{ secrets.FALIX_PASSWORD }}
          SERVER_ID: ${{ secrets.SERVER_ID || '2845100' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          mkdir -p screenshots
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node renew.js

      - name: Upload Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falix-screenshots
          path: screenshots/
          retention-days: 7

      - name: Cleanup Proxy
        if: always()
        run: |
          if [ -f sing-box.pid ]; then
            kill -9 $(cat sing-box.pid) || true
          fi
          rm -rf sing-box* config.json singbox-config.json
