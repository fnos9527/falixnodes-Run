name: Falix Auto Renew

on:
  schedule:
    - cron: '17 2 * * *'   # 每天一次 (UTC 02:17 = 北京时间 10:17)
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖 (xvfb + npm)
        run: |
          sudo apt-get update -y && sudo apt-get install -y xvfb
          npm install --no-audit --no-fund

      # ---- 恢复上次保存的 Cookie ----
      - name: 恢复 Cookie 缓存
        uses: actions/cache/restore@v4
        with:
          path: data
          key: falix-data-${{ github.run_id }}
          restore-keys: falix-data-

      # ---- 安装并启动 sing-box ----
      - name: 生成 sing-box 配置
        env:
          PROXY_LINKS: ${{ secrets.PROXY_LINKS }}
        run: node gen-config.js

      - name: 安装 sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.assets[].browser_download_url | select(test("linux-amd64\\.tar\\.gz$"))' | head -1)
          echo "下载: $URL"
          curl -L "$URL" -o sb.tar.gz
          tar -xzf sb.tar.gz --strip-components=1 --wildcards '*/sing-box'
          chmod +x sing-box
          ./sing-box version

      - name: 启动代理并测试
        run: |
          ./sing-box check -c config.json
          nohup ./sing-box run -c config.json > singbox.log 2>&1 &
          sleep 8
          pgrep -a sing-box || { echo "sing-box 进程不存在"; cat singbox.log; exit 1; }

          N=$(jq '[.outbounds[] | select(.type=="vless")] | length' config.json)
          echo "=== 单节点测试 (共 $N 个), 目标: client.falixnodes.net ==="
          for i in $(seq 1 $N); do
            P=$((1080+i))
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 --socks5-hostname 127.0.0.1:$P https://client.falixnodes.net/auth/login 2>&1 || true)
            echo "节点$i -> HTTP $CODE  (000/超时=无法访问Falix; 200/403/503=能连上)"
          done

          echo "=== 自动选路测试 (127.0.0.1:1080) ==="
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 --socks5-hostname 127.0.0.1:1080 https://client.falixnodes.net/auth/login 2>/dev/null || true)
            echo "第$i次: HTTP $CODE"
            if [ "$CODE" != "000" ] && [ -n "$CODE" ]; then
              echo "代理可访问 Falix"
              curl -s --max-time 15 --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|loc|colo)=" || true
              exit 0
            fi
            sleep 3
          done
          echo "所有节点都无法访问 Falix。若节点是 Cloudflare Workers 类型(带 ?ed=2048)，它无法访问 CF 托管的网站，请改用 VPS 直连节点。"
          echo "--- sing-box 日志 ---"; tail -60 singbox.log; exit 1

      # ---- 执行续期 ----
      - name: 执行续期
        env:
          FALIX_EMAIL: ${{ secrets.FALIX_EMAIL }}
          FALIX_PASSWORD: ${{ secrets.FALIX_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVER_ID: ${{ vars.SERVER_ID || '2845100' }}
        run: node renew.js

      # ---- 保存 Cookie（失败也保存）----
      - name: 保存 Cookie 缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: falix-data-${{ github.run_id }}

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore
